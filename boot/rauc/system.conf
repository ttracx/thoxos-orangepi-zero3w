#
# NOT active on the v1 vendor-layout image; installed only when the
# production GPT is measured. See ../slots.md. v1 keeps the vendor single
# ext4 root. There are no rootfs.0 / rootfs.1 partlabels on that image.
# U-Boot A/B is not wired. The health gate is userspace
# (thoxos-health.service). bootloader=uboot is the production target
# backend, not a claim that 1.0.0 saves BOOT_ORDER.

[system]
compatible=thoxos-opi3w
bootloader=uboot

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs.0
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs.1
type=ext4
bootname=B
